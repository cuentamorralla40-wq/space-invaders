name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip git python3-pip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Initialize Buildozer config
        run: |
          echo -e "[app]\ntitle = Space Invaders\npackage.name = spaceinvaders\npackage.domain = org.game\nsource.include_exts = py,png,jpg,kv,atlas\nsource.dir = .\nversion = 1.0\nrequirements = python3,pygame\norientation = portrait\nfullscreen = 1\nandroid.permissions = INTERNET\nandroid.api = 31\nandroid.minapi = 21\nandroid.sdk = 30\nandroid.ndk = 25b\nandroid.archs = arm64-v8a" > buildozer.spec

      - name: Build with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
