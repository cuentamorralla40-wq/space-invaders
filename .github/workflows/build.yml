name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            unzip \
            ant \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config

      - name: Install Buildozer and Dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.36 virtualenv
          pip install --upgrade buildozer

      - name: Run Buildozer
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          buildozer --debug android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
